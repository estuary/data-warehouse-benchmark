      # is Date32, the 3 *EventTime columns are RFC 3339 strings. The
      # collection schema (including format hints for the 4 temporal
      # columns) is auto-injected by `staging/estuary.py:_inject_capture_collections`
      # via `datagen/collection_schemas.py:build_collection_schemas`.
      - resource: { stream: "${BENCHMARK_S3_BUCKET}/data/clickbench/hits.parquet" }
        target: ${ESTUARY_ACCOUNT}/benchmark/clickbench/hits
