      - resource: { stream: "${BENCHMARK_S3_BUCKET}/data/tpcds/sf1/customer.parquet" }
        target: ${ESTUARY_ACCOUNT}/benchmark/tpcds/sf1/customer
      - resource: { stream: "${BENCHMARK_S3_BUCKET}/data/tpcds/sf1/customer_address.parquet" }
        target: ${ESTUARY_ACCOUNT}/benchmark/tpcds/sf1/customer_address
      - resource: { stream: "${BENCHMARK_S3_BUCKET}/data/tpcds/sf1/customer_demographics.parquet" }
