# Estuary capture: ALL benchmark Parquet (TPC-DS + DSB + ClickBench) from S3.
#
# One source-s3:v2 connector at the bucket level, 145 file-level bindings
# (TPC-DS + DSB across SF1-SF100, plus ClickBench). SF1000 is ingested by the
# split captures in source-s3-sf1000.flow.yaml (never add those bindings
# here). Each binding emits one Flow collection per parquet file so the
# materializer downstream can write the native tables in MotherDuck (no
# view-splitting).
#
# Apply with:
#   uv run benchmark flow-publish source-s3
#
# The collection target names are stable; the materializations bind to them
# (N = 1, 10, 100 here; the sf1000 collections come from the split captures):
#   ${ESTUARY_ACCOUNT}/benchmark/tpcds/sf<N>/<table>    (24 per scale)
#   ${ESTUARY_ACCOUNT}/benchmark/dsb/sf<N>/<table>      (24 per scale)
#   ${ESTUARY_ACCOUNT}/benchmark/clickbench/hits        (1)
#
# Env vars expected (resolved by `benchmark flow-publish` from env/<section>.env):
#   ESTUARY_ACCOUNT, BENCHMARK_S3_BUCKET, AWS_REGION,
#   ESTUARY_S3_AWS_ACCESS_KEY_ID, ESTUARY_S3_AWS_SECRET_ACCESS_KEY

captures:
  ${ESTUARY_ACCOUNT}/benchmark/captures/source-s3:
    # runtime-v2 on the production data plane. Roll publishes out per engine
    # via scoped re-backfill validation (see docs/OPERATOR_GUIDE.md).
    shards:
      flags:
        enable-runtime-v2: "true"
    endpoint:
      connector:
        image: ghcr.io/estuary/source-s3:v2
        config:
          bucket: ${BENCHMARK_S3_BUCKET}
          region: ${AWS_REGION}
          prefix: data/
          credentials:
            auth_type: AWSAccessKey
            aws_access_key_id: ${ESTUARY_S3_AWS_ACCESS_KEY_ID}
            aws_secret_access_key: ${ESTUARY_S3_AWS_SECRET_ACCESS_KEY}
          parser:
            format:
              type: auto
    bindings:
      # ── TPC-DS SF1 (24 tables) ────────────────────────────────────────────
      - resource: { stream: "${BENCHMARK_S3_BUCKET}/data/tpcds/sf1/call_center.parquet" }
