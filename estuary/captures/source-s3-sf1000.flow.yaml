# Estuary captures: SF1000 Parquet from S3 — SPLIT ACROSS 24 CAPTURE TASKS.
#
# SF1000 is ~13.3B documents (TPC-DS 6.3B + DSB 6.9B per the expected-count
# manifests), far more than one capture task should carry; splitting the ingest
# across tasks scales throughput linearly. The 48 table streams are LPT-packed
# (biggest-first, least-loaded bin; sized by sf100 counts x10, the "est docs"
# comments below, which overstate the tables that grow sublinearly such as
# inventory) into 24 captures: wall-clock is lower-bounded by the largest single
# stream regardless of task count, so 24 packed tasks match 48 per-stream tasks
# while staying comfortably inside the tenant task allowance.
#
# Every task here carries `shards.disable: true`, so publishing this file
# creates or updates the captures paused; remove the flag to run the ingest.
#
# source-s3.flow.yaml carries no sf1000 bindings: the two specs must never
# both carry them, or the shared target collections ingest every document
# twice (delta-update materializations would double-count). Do NOT add
# sf1000 bindings to source-s3 after these captures are torn down: a new
# binding starts a fresh backfill and re-ingests everything.
#
# Teardown after ingest completes (counts validated on all engines):
#   uv run benchmark flow-delete ${ESTUARY_ACCOUNT}/benchmark/captures/sf1000-partNN ...
#
# Apply with:
#   uv run benchmark flow-auth
#   uv run benchmark flow-publish sf1000-captures
#
# Env vars expected (resolved by `benchmark flow-publish`):
#   ESTUARY_ACCOUNT, BENCHMARK_S3_BUCKET, AWS_REGION,
#   ESTUARY_S3_AWS_ACCESS_KEY_ID, ESTUARY_S3_AWS_SECRET_ACCESS_KEY

captures:

  ${ESTUARY_ACCOUNT}/benchmark/captures/sf1000-part01:
    # ~3,993,300,000 est docs: tpcds/inventory
    shards:
      disable: true
      flags:
        enable-runtime-v2: "true"
    endpoint:
      connector:
        image: ghcr.io/estuary/source-s3:v2
        config:
          bucket: ${BENCHMARK_S3_BUCKET}
          region: ${AWS_REGION}
          prefix: data/
          credentials:
            auth_type: AWSAccessKey
            aws_access_key_id: ${ESTUARY_S3_AWS_ACCESS_KEY_ID}
            aws_secret_access_key: ${ESTUARY_S3_AWS_SECRET_ACCESS_KEY}
          parser:
            format:
              type: auto
    bindings:

      - resource: { stream: "${BENCHMARK_S3_BUCKET}/data/tpcds/sf1000/inventory.parquet" }
        target: ${ESTUARY_ACCOUNT}/benchmark/tpcds/sf1000/inventory

  ${ESTUARY_ACCOUNT}/benchmark/captures/sf1000-part02:
