# Estuary materialization: TPC-DS + DSB (SF1–SF1000) + ClickBench -> MotherDuck.
#
# Apply with:
#   uv run benchmark flow-publish motherduck
#
# 9 materialization blocks: TPC-DS and DSB each at SF1/SF10/SF100/SF1000, plus
# ClickBench (single scale), each writing into a distinct MotherDuck schema
# inside `benchmark_db` — scale is the schema suffix:
#   benchmark_db.tpcds_sf<N>  — 24 TPC-DS tables (uniform data)
#   benchmark_db.dsb_sf<N>    — 24 DSB tables    (skewed-distribution data)
#   benchmark_db.clickbench   — 1 ClickBench hits table
#
# The benchmark CLI's `sql` and `validate-sf1` commands pick the right schema
# per query block, so the runner issues TPC-DS queries against `tpcds_sf<N>`,
# DSB queries against `dsb_sf<N>`, and ClickBench queries against `clickbench`
# inside a single invocation.
#
# materialize-motherduck stages intermediate files in S3 (under
# s3://${BENCHMARK_S3_BUCKET}/estuary-staging/) before each load — that's why
# the IAM user policy in terraform/modules/shared grants the Estuary IAM user
# PutObject + DeleteObject specifically scoped to estuary-staging/*.
#
# Env vars expected (resolved by `benchmark flow-publish` from env/<section>.env):
#   ESTUARY_ACCOUNT, MOTHERDUCK_TOKEN, BENCHMARK_S3_BUCKET, AWS_REGION,
#   ESTUARY_S3_AWS_ACCESS_KEY_ID, ESTUARY_S3_AWS_SECRET_ACCESS_KEY

materializations:
  ${ESTUARY_ACCOUNT}/benchmark/materializations/motherduck-tpcds-sf1:
    # runtime-v2 on the production (non-BYOC) data-plane. Roll changes out per
    # block via scoped publish + backfill bump, never full-spec (docs/OPERATOR_GUIDE.md).
    shards:
      flags:
        enable-runtime-v2: "true"
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-motherduck:v4
        config:
          token: ${MOTHERDUCK_TOKEN}
          database: benchmark_db
          schema: tpcds_sf1
          hardDelete: false
          stagingBucket:
            stagingBucketType: S3
            bucketS3: ${BENCHMARK_S3_BUCKET}
            awsAccessKeyId: ${ESTUARY_S3_AWS_ACCESS_KEY_ID}
            awsSecretAccessKey: ${ESTUARY_S3_AWS_SECRET_ACCESS_KEY}
            region: ${AWS_REGION}
            bucketPathS3: estuary-staging/motherduck/tpcds-sf1/
    bindings:
      - source: ${ESTUARY_ACCOUNT}/benchmark/tpcds/sf1/call_center
        resource: { table: call_center, delta_updates: true }
        backfill: 1
        fields:
          recommended: true
          exclude: [flow_published_at]
