# Estuary materialization: TPC-DS + DSB (SF1–SF1000) + ClickBench -> Microsoft
# Fabric Data Warehouse.
#
# 15 materialization blocks: TPC-DS and DSB each at SF1/SF10/SF100/SF1000, plus
# per-suite SF1000 fact splits (below), plus ClickBench (single scale), writing
# into one schema per suite and scale inside the Fabric DW
# (${FABRIC_DW_DATABASE}, e.g. BENCHMARK_DW); scale is the schema suffix
# (Fabric caps at SF1000: 4 TB OneLake):
#   tpcds_sf<N>  — 24 TPC-DS tables (uniform data)
#   dsb_sf<N>    — 24 DSB tables    (skewed-distribution data)
#   clickbench   — 1 hits table     (web analytics, full ~100M-row typed file)
#
# At SF1000 the four fact tables are split into dedicated mats
# (fabric-<suite>-store-sales-sf1000, -catalog-sales-, -web-inventory-): one Estuary
# task is one sequential pipeline, so dedicated tasks parallelize the big fact
# backfills. Their tables land in <suite>_sf1000; each split keeps its Estuary
# checkpoint table in its own endpoint schema (estuary_<suite>_<split>_sf1000).
#
# Connector: materialize-azure-fabric-warehouse. Unlike Redshift (S3 COPY),
# this stages temp files in an Azure Storage container and COPY-INTOs them into
# the DW. It authenticates to the DW as the service principal created by
# terraform/modules/fabric (FABRIC_CLIENT_ID / FABRIC_CLIENT_SECRET, granted
# Admin on the workspace), and to the staging storage with the account key.
#
# Apply with:
#   uv run benchmark flow-auth
#   uv run benchmark flow-publish fabric
#
# Env vars expected (resolved by `benchmark flow-publish` from env/<section>.env):
#   ESTUARY_ACCOUNT,
#   FABRIC_CLIENT_ID, FABRIC_CLIENT_SECRET,
#   FABRIC_DW_DATABASE  (warehouse name, e.g. BENCHMARK_DW),
#   FABRIC_DW_ENDPOINT  (warehouse SQL connection string),
#   FABRIC_STAGING_STORAGE_ACCOUNT, FABRIC_STAGING_STORAGE_KEY,
#   FABRIC_STAGING_CONTAINER  (all from `terraform output`)

materializations:
  ${ESTUARY_ACCOUNT}/benchmark/materializations/fabric-tpcds-sf1:
    # runtime-v2 on the production (non-BYOC) data-plane. Roll changes out per
    # block via scoped publish + backfill bump, never full-spec (docs/OPERATOR_GUIDE.md).
    shards:
      flags:
        enable-runtime-v2: "true"
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-azure-fabric-warehouse:v1
        config:
          clientID: ${FABRIC_CLIENT_ID}
          clientSecret: ${FABRIC_CLIENT_SECRET}
          warehouse: ${FABRIC_DW_DATABASE}
          connectionString: ${FABRIC_DW_ENDPOINT}
          schema: tpcds_sf1
          storageAccountName: ${FABRIC_STAGING_STORAGE_ACCOUNT}
          storageAccountKey: ${FABRIC_STAGING_STORAGE_KEY}
          containerName: ${FABRIC_STAGING_CONTAINER}
          directory: estuary-staging/fabric/tpcds-sf1/
    bindings:
      - source: ${ESTUARY_ACCOUNT}/benchmark/tpcds/sf1/call_center
        resource: { table: call_center, delta_updates: true }
        backfill: 1
        fields:
          recommended: true
