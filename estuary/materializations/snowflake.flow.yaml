# Estuary materialization: TPC-DS + DSB (SF1–SF1000) + ClickBench -> Snowflake BENCHMARK_DB.
#
# 15 materialization blocks: TPC-DS and DSB each at SF1/SF10/SF100/SF1000, plus
# per-suite SF1000 fact splits (below), plus ClickBench (single scale). Snowflake
# has a database→schema hierarchy (unlike ClickHouse), so all write into the single
# BENCHMARK_DB database and split by schema; scale is the schema suffix:
#   snowflake-tpcds-sf<N>  — 24 TPC-DS tables -> schema TPCDS_SF<N> (uniform data)
#   snowflake-dsb-sf<N>    — 24 DSB tables    -> schema DSB_SF<N>   (skewed-distribution data)
#   snowflake-clickbench   — 1 hits table     -> schema CLICKBENCH  (web analytics)
#
# At SF1000 the four fact tables are split into dedicated mats
# (snowflake-<suite>-store-sales-sf1000, -catalog-sales-, -web-inventory-) writing
# into the same <SUITE>_SF1000 schema: one Estuary task is one sequential pipeline,
# so dedicated tasks parallelize the big fact backfills.
#
# Schemas, warehouses, the BENCHMARK_ROLE, and the service user are all
# provisioned by terraform (terraform/modules/snowflake). The connector loads
# into Estuary-owned tables, which the benchmark queries as loaded (no
# physical design).
#
# Connector: materialize-snowflake. Auth is JWT key-pair (TYPE = SERVICE users
# can't password-auth). The privateKey is the full PKCS#8 PEM, inlined from the
# SNOWFLAKE_BENCHMARK_PRIVATE_KEY computed property (reads the .p8 file at
# SNOWFLAKE_BENCHMARK_PRIVATE_KEY_FILE). `benchmark flow-publish` re-indents the
# multi-line PEM under the `|` block scalar at substitution time.
#
# Apply with:
#   uv run benchmark flow-auth
#   uv run benchmark flow-publish snowflake
#
# Env vars expected (resolved by `benchmark flow-publish` from env/<section>.env):
#   ESTUARY_ACCOUNT,
#   SNOWFLAKE_ACCOUNT,
#   SNOWFLAKE_BENCHMARK_USER,
#   SNOWFLAKE_BENCHMARK_PRIVATE_KEY  (computed from SNOWFLAKE_BENCHMARK_PRIVATE_KEY_FILE)

materializations:
  ${ESTUARY_ACCOUNT}/benchmark/materializations/snowflake-tpcds-sf1:
    # runtime-v2 on the production (non-BYOC) data-plane. Roll changes out per
    # block via scoped publish + backfill bump, never full-spec (docs/OPERATOR_GUIDE.md).
    shards:
      flags:
        enable-runtime-v2: "true"
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-snowflake:v4
        config:
          host: ${SNOWFLAKE_ACCOUNT}.snowflakecomputing.com
          account: ${SNOWFLAKE_ACCOUNT}
          credentials:
            auth_type: jwt
            user: ${SNOWFLAKE_BENCHMARK_USER}
            private_key: |
              ${SNOWFLAKE_BENCHMARK_PRIVATE_KEY}
          database: BENCHMARK_DB
          schema: TPCDS_SF1
          # XLARGE: load throughput is warehouse-bound; materialization rounds
          # drain ~4x faster than on MEDIUM and the warehouse auto-suspends
          # between loads, so the idle cost is unchanged.
          warehouse: BENCHMARK_WH_XLARGE
          role: BENCHMARK_ROLE
          # NTZ (no timezone) mirrors DuckDB's timezone-less TIMESTAMP, so
          # loaded values match the ground-truth hashes without session-TZ
          # conversion. Required field in materialize-snowflake v4.
          timestamp_type: "TIMESTAMP_NTZ (discard TZ)"
    bindings:
      - source: ${ESTUARY_ACCOUNT}/benchmark/tpcds/sf1/call_center
        resource: { table: CALL_CENTER, delta_updates: true }
        backfill: 1
        fields:
          recommended: true
          exclude: [flow_published_at]
      - source: ${ESTUARY_ACCOUNT}/benchmark/tpcds/sf1/catalog_page
        resource: { table: CATALOG_PAGE, delta_updates: true }
        backfill: 1
        fields:
          recommended: true
          exclude: [flow_published_at]
