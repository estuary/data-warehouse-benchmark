# Estuary materialization: TPC-DS + DSB (SF1–SF1000) + ClickBench -> ClickHouse Cloud.
#
# 21 materialization blocks: TPC-DS and DSB each at SF1/SF10/SF100/SF1000, plus
# per-suite SF100+SF1000 fact splits (store-sales / catalog-sales / web-inventory — one
# Estuary task = one sequential pipeline, so the big facts backfill in parallel), plus
# ClickBench (single scale). Each suite and scale is its own ClickHouse database
# (ClickHouse has no schema-inside-database concept, so suite+scale ↔ database); a
# split writes into its suite's database at that scale:
#   tpcds_sf<N>  — 24 TPC-DS tables (uniform data)
#   dsb_sf<N>    — 24 DSB tables    (skewed-distribution data)
#   clickbench   — 1 hits table     (web analytics, full ~100M-row typed file)
#
# Connector: materialize-clickhouse. Authenticates with user + password over the
# service's native-secure port (9440). The connector creates tables but not
# databases, so `benchmark flow-publish clickhouse` first runs
# CREATE DATABASE IF NOT EXISTS for every database named below
# (staging/clickhouse_prepare.py; also `benchmark clickhouse-prepare-databases`).
#
# Apply with:
#   uv run benchmark flow-auth
#   uv run benchmark flow-publish clickhouse
#
# Env vars expected (resolved by `benchmark flow-publish` from env/<section>.env):
#   ESTUARY_ACCOUNT,
#   CLICKHOUSE_HOST, CLICKHOUSE_USER, CLICKHOUSE_PASSWORD

materializations:
  ${ESTUARY_ACCOUNT}/benchmark/materializations/clickhouse-tpcds-sf1:
    # runtime-v2 on the production (non-BYOC) data-plane. Roll changes out per
    # block via scoped publish + backfill bump, never full-spec (docs/OPERATOR_GUIDE.md).
    shards:
      flags:
        enable-runtime-v2: "true"
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-clickhouse:v1
        config:
          # Native TCP-secure port (9440), not the HTTPS port (8443) the
          # Python harness uses — Estuary's materializer speaks the native
          # protocol.
          address: ${CLICKHOUSE_HOST}:9440
          database: tpcds_sf1
          credentials:
            auth_type: user_password
            username: ${CLICKHOUSE_USER}
            password: ${CLICKHOUSE_PASSWORD}
    bindings:
      - source: ${ESTUARY_ACCOUNT}/benchmark/tpcds/sf1/call_center
        resource: { table: call_center, delta_updates: true }
        backfill: 1
        fields:
          recommended: true
          exclude: [flow_published_at]
      - source: ${ESTUARY_ACCOUNT}/benchmark/tpcds/sf1/catalog_page
