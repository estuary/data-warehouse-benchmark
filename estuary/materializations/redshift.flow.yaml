# Estuary materialization: TPC-DS + DSB (SF1–SF1000) + ClickBench -> Redshift Serverless.
#
# 21 materialization blocks: TPC-DS and DSB each at SF1/SF10/SF100/SF1000, plus
# per-suite SF100 and SF1000 fact splits (below), plus ClickBench (single scale),
# writing into one Redshift schema per suite and scale inside the
# ${REDSHIFT_DATABASE} database; scale is the schema suffix. At SF1 and SF10 there
# is one materialization per schema, per Estuary's Redshift locking guidance:
#   <db>.tpcds_sf<N>  — 24 TPC-DS tables (uniform data)
#   <db>.dsb_sf<N>    — 24 DSB tables    (skewed-distribution data)
#   <db>.clickbench   — 1 hits table     (web analytics, 100M rows full)
#
# At SF100/SF1000 the four fact tables are split into dedicated mats
# (…-store-sales-sf<N>, …-catalog-sales-sf<N>, …-web-inventory-sf<N>) writing
# into the SAME <suite>_sf<N> schema — one Estuary task = one sequential
# pipeline, so dedicated tasks parallelize the big fact backfills (same
# pattern as clickhouse.flow.yaml).
#
# Staging-bucket strategy: re-use the shared ${BENCHMARK_S3_BUCKET} bucket and
# ${ESTUARY_S3_AWS_*} credentials the source-s3 capture already uses, with
# per-materialization `bucketPath` prefixes to keep the staging files
# namespaced. Redshift can COPY from this bucket because the IAM role created
# by terraform/modules/redshift gives the workgroup read access.
#
# Apply with:
#   uv run benchmark flow-publish redshift
#
# Env vars expected (resolved by `benchmark flow-publish` from env/<section>.env):
#   ESTUARY_ACCOUNT, AWS_REGION, BENCHMARK_S3_BUCKET,
#   ESTUARY_S3_AWS_ACCESS_KEY_ID, ESTUARY_S3_AWS_SECRET_ACCESS_KEY,
#   REDSHIFT_ENDPOINT (from `terraform output redshift_endpoint`),
#   REDSHIFT_USER, REDSHIFT_PASSWORD, REDSHIFT_DATABASE

materializations:
  ${ESTUARY_ACCOUNT}/benchmark/materializations/redshift-tpcds-sf1:
    # runtime-v2 on the production (non-BYOC) data-plane. Roll changes out per
    # block via scoped publish + backfill bump, never full-spec (docs/OPERATOR_GUIDE.md).
    shards:
      flags:
        enable-runtime-v2: "true"
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-redshift:dev
        config:
          address: ${REDSHIFT_ENDPOINT}
          user: ${REDSHIFT_USER}
          password: ${REDSHIFT_PASSWORD}
          database: ${REDSHIFT_DATABASE}
          schema: tpcds_sf1
          bucket: ${BENCHMARK_S3_BUCKET}
          bucketPath: estuary-staging/redshift/tpcds-sf1/
          awsAccessKeyId: ${ESTUARY_S3_AWS_ACCESS_KEY_ID}
          awsSecretAccessKey: ${ESTUARY_S3_AWS_SECRET_ACCESS_KEY}
          region: ${AWS_REGION}
    bindings:
      - source: ${ESTUARY_ACCOUNT}/benchmark/tpcds/sf1/call_center
        resource: { table: call_center, delta_updates: true }
        backfill: 1
        fields:
          recommended: true
          exclude: [flow_published_at]
