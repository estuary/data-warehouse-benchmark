# Estuary materialization: TPC-DS + DSB (SF1–SF1000) + ClickBench -> Databricks SQL.
#
# 15 materialization blocks: TPC-DS and DSB each at SF1/SF10/SF100/SF1000, plus
# per-suite SF1000 fact splits (below), plus ClickBench (single scale), writing
# into one schema per suite and scale inside the ${DATABRICKS_CATALOG} catalog;
# scale is the schema suffix:
#   <catalog>.tpcds_sf<N>  — 24 TPC-DS tables (uniform data)
#   <catalog>.dsb_sf<N>    — 24 DSB tables    (skewed-distribution data)
#   <catalog>.clickbench   — 1 ClickBench hits table
#
# This matches the schema convention every other engine uses and the one the
# benchmark CLI's `sql`/`validate-sf1` commands pass to the connector
# (DatabricksConnector qualifies tables as <catalog>.<schema>.<table>, with
# schema = tpcds_sf{N} / dsb_sf{N} / clickbench).
#
# Apply with:
#   uv run benchmark flow-auth
#   uv run benchmark flow-publish databricks
#
# At SF1000 the four fact tables are split into dedicated mats
# (databricks-<suite>-store-sales-sf1000, -catalog-sales-, -web-inventory-), writing
# into the same <suite>_sf1000 schema: one Estuary task is one sequential pipeline,
# so dedicated tasks parallelize the big fact backfills (the Redshift spec's split).
#
# Every mat writes through DATABRICKS_LOADER_SQL_HTTP_PATH, which defaults to the
# benchmark warehouse (DATABRICKS_SQL_HTTP_PATH). Point it at a separate warehouse to
# keep a long load off the warehouse being measured.
#
# Env vars expected (resolved by `benchmark flow-publish` from env/<section>.env):
#   ESTUARY_ACCOUNT, DATABRICKS_HOST, DATABRICKS_LOADER_SQL_HTTP_PATH,
#   DATABRICKS_TOKEN, DATABRICKS_CATALOG

materializations:
  ${ESTUARY_ACCOUNT}/benchmark/materializations/databricks-tpcds-sf1:
    # runtime-v2 on the production (non-BYOC) data-plane. Roll changes out per
    # block via scoped publish + backfill bump, never full-spec (docs/OPERATOR_GUIDE.md).
    shards:
      flags:
        enable-runtime-v2: "true"
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-databricks:dev
        config:
          address: ${DATABRICKS_HOST}
          http_path: ${DATABRICKS_LOADER_SQL_HTTP_PATH}
          credentials:
            auth_type: PAT
            personal_access_token: ${DATABRICKS_TOKEN}
          catalog_name: ${DATABRICKS_CATALOG}
          schema_name: tpcds_sf1
    bindings:
      - source: ${ESTUARY_ACCOUNT}/benchmark/tpcds/sf1/call_center
        resource: { table: call_center, schema: tpcds_sf1, delta_updates: true }
        backfill: 1
        fields:
          recommended: true
          exclude: [flow_published_at]
      - source: ${ESTUARY_ACCOUNT}/benchmark/tpcds/sf1/catalog_page
        resource: { table: catalog_page, schema: tpcds_sf1, delta_updates: true }
