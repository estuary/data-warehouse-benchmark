# Estuary materialization: TPC-DS + DSB (SF1–SF1000) + ClickBench -> BigQuery.
#
# Apply with:
#   benchmark flow-publish estuary/materializations/bigquery.flow.yaml
#
# 9 materialization blocks: TPC-DS and DSB each at SF1/SF10/SF100/SF1000, plus
# ClickBench (single scale), each writing into a distinct BigQuery dataset —
# scale is the dataset suffix:
#   tpcds_sf<N>  — 24 TPC-DS tables (uniform data)
#   dsb_sf<N>    — 24 DSB tables    (skewed-distribution data)
#   clickbench   — 1 ClickBench hits table
#
# materialize-bigquery stages data in GCS then issues BigQuery Load jobs.
# The GCS bucket is provisioned by terraform/modules/bigquery (output:
# bigquery_estuary_staging_bucket).
#
# Env vars expected (resolved by `benchmark flow-publish` from env/<section>.env):
#   ESTUARY_ACCOUNT, BIGQUERY_PROJECT, BIGQUERY_REGION,
#   BIGQUERY_GCS_STAGING_BUCKET, ESTUARY_BIGQUERY_SERVICE_ACCOUNT_JSON

materializations:
  ${ESTUARY_ACCOUNT}/benchmark/materializations/bigquery-tpcds-sf1:
    # runtime-v2 on the production (non-BYOC) data-plane. Roll changes out per
    # block via scoped publish + backfill bump, never full-spec (docs/OPERATOR_GUIDE.md).
    shards:
      flags:
        enable-runtime-v2: "true"
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-bigquery:v3
        config:
          project_id: ${BIGQUERY_PROJECT}
          dataset: tpcds_sf1
          region: ${BIGQUERY_REGION}
          bucket: ${BIGQUERY_GCS_STAGING_BUCKET}
          bucket_path: estuary-staging/bigquery/tpcds-sf1/
          credentials:
            auth_type: CredentialsJSON
            credentials_json: '${ESTUARY_BIGQUERY_SERVICE_ACCOUNT_JSON}'
    bindings:
      - source: ${ESTUARY_ACCOUNT}/benchmark/tpcds/sf1/call_center
        resource: { table: call_center, delta_updates: true }
        backfill: 1
        fields:
          recommended: true
          exclude: [flow_published_at]
      - source: ${ESTUARY_ACCOUNT}/benchmark/tpcds/sf1/catalog_page
